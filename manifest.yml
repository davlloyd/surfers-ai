applications:
- name: surfers-ai
  memory: 512M
  disk_quota: 1G
  buildpacks:
    - python_buildpack
  command: gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
  env:
    FLASK_APP: app.py
    LOG_LEVEL: INFO
    CACHE_TYPE: simple
    CACHE_DEFAULT_TIMEOUT: 300
    MCP_WEATHER_URL: https://mcp-weather-server.apps.tas.tanzu.rocks
    MCP_TIMEOUT: 30
  health-check-type: process
